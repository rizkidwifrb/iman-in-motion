global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8080

  - job_name: recommendation-engine
    metrics_path: /metrics
    static_configs:
      - targets:
          - recommendation-engine:8081

  - job_name: rag-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - rag-service:8082

  - job_name: scheduler
    metrics_path: /metrics
    static_configs:
      - targets:
          - scheduler:8083

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
